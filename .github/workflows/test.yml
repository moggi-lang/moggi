name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64,   os: ubuntu-24.04}
          - {name: linux-aarch64,  os: ubuntu-24.04-arm}
          - {name: macos-x86_64,   os: macos-15-intel}
          - {name: macos-aarch64,  os: macos-latest}
          - {name: windows-x86_64, os: windows-2022, msystem: UCRT64, msysPackages: 'mingw-w64-ucrt-x86_64-gcc make'}

    steps:
      - uses: actions/checkout@v7.0.1

      # PHP extensions.
      - name: Cache PHP extensions
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: '8.5'
          extensions: bcmath, mbstring, zip, phar, ctype, intl
          key: php-8.5-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Set up PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          extensions: bcmath, mbstring, zip, phar, ctype, intl
          ini-values: memory_limit=1G
          coverage: none

      # GraalVM and native-image.
      - name: Cache GraalVM
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/Java_GraalVM_jdk
          key: graalvm-21-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Set up GraalVM
        uses: actions/setup-java@v6.1.0
        with:
          distribution: graalvm
          java-version: '21'

      # Maven installation and dependency repository.
      - name: Cache Maven installation
        uses: actions/cache@v4
        with:
          path: ~/maven
          key: maven-3.9.12-${{ runner.os }}-${{ runner.arch }}

      - name: Set up Maven (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          MAVEN_VERSION=3.9.12
          if [ -x "$HOME/maven/bin/mvn" ]; then
            echo "Maven restored from cache"
          else
            curl -fsSL -o /tmp/maven.tar.gz \
              "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
            mkdir -p "$HOME/maven"
            tar -xzf /tmp/maven.tar.gz -C "$HOME/maven" --strip-components=1
          fi
          echo "$HOME/maven/bin" >> "$GITHUB_PATH"

      - name: Set up Maven (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mavenVersion = '3.9.12'
          $mavenBin = "$env:USERPROFILE\maven\apache-maven-${mavenVersion}\bin"
          if (Test-Path "$mavenBin\mvn.cmd") {
            Write-Host "Maven restored from cache"
          } else {
            Invoke-WebRequest `
              -Uri "https://archive.apache.org/dist/maven/maven-3/${mavenVersion}/binaries/apache-maven-${mavenVersion}-bin.zip" `
              -OutFile "$env:TEMP\maven.zip"
            Expand-Archive -Path "$env:TEMP\maven.zip" -DestinationPath "$env:USERPROFILE\maven" -Force
          }
          "$mavenBin" >> $env:GITHUB_PATH

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-deps-${{ runner.os }}-${{ runner.arch }}-v1

      # .NET SDK and NuGet.
      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/dotnet
          key: dotnet-8-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('libraries/**/*.csproj', 'libraries/**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Show the toolchains
        run: |
          php --version
          java -version
          dotnet --version
          native-image --version
          mvn --version

      # Linux C toolchain.
      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-${{ runner.os }}-${{ runner.arch }}-clang-v1

      - name: Install a C toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      # Windows C toolchain.
      - name: Install MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.msysPackages }}
          path-type: inherit
          cache: true

      - name: Set up the MSVC toolchain (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      # Schnorr CLI.
      - name: Cache Schnorr CLI
        id: schnorr-cache
        uses: actions/cache@v4
        with:
          path: schnorr
          key: schnorr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/schnorr.php', 'schnorr/**') }}

      - name: Build the schnorr CLI
        if: runner.os != 'Windows' && steps.schnorr-cache.outputs.cache-hit != 'true'
        shell: bash
        run: php packaging/schnorr.php

      - name: Build the schnorr CLI (Windows)
        if: runner.os == 'Windows' && steps.schnorr-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: php packaging/schnorr.php

      - name: Run the schnorr BIP-340 vectors
        if: runner.os != 'Windows'
        shell: bash
        run: ./schnorr/tests/bip340_test.sh

      - name: Run the schnorr BIP-340 vectors (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./schnorr/tests/bip340_test.sh

      # Moggi's persistent compiler-managed artifacts.
      - name: Cache Moggi artifacts
        uses: actions/cache@v4
        with:
          path: |
            .moggi/runtime
            .moggi/catalog
            .moggi/packages
          key: moggi-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('libraries/*/*.moggi', 'libraries/*/meta/**', 'tests/registry/**') }}
          restore-keys: |
            moggi-${{ runner.os }}-${{ runner.arch }}-

      - name: Run the suite
        run: php test-all.php --backend all --native
