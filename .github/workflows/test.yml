name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64,   os: ubuntu-24.04}
          - {name: linux-aarch64,  os: ubuntu-24.04-arm}
          - {name: macos-aarch64,  os: macos-latest}
          - {name: windows-x86_64, os: windows-2022}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: bcmath, mbstring, zip, phar, ctype
          ini-values: memory_limit=1G
          coverage: none

      - name: Set up GraalVM (JDK 21 + native-image)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: graalvm
          java-version: '21'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Show the toolchains
        run: |
          php --version
          java -version
          native-image --version
          dotnet --version

      - name: Install a C toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install MSYS2 (MinGW) for the schnorr CLI
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@f84a36b4009b96413f91c01441130855db9392e5 # v2.9.0
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc make

      - name: Build the schnorr CLI
        if: runner.os != 'Windows'
        shell: bash
        run: php scripts/dist/schnorr.php

      - name: Build the schnorr CLI (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: php scripts/dist/schnorr.php

      - name: Run the schnorr BIP-340 vectors
        if: runner.os != 'Windows'
        shell: bash
        run: ./schnorr/tests/bip340_test.sh

      - name: Run the schnorr BIP-340 vectors (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./schnorr/tests/bip340_test.sh

      - name: Point the assembler at the schnorr binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $schnorr = if (Test-Path schnorr/schnorr.exe) { 'schnorr\schnorr.exe' } else { 'schnorr\schnorr' }
          "MOGGI_DIST_SCHNORR=$env:GITHUB_WORKSPACE\$schnorr" >> $env:GITHUB_ENV

      - name: Run the suite
        run: php test.php --backend all --native
