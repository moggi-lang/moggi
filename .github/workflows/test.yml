name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64,   os: ubuntu-24.04}
          - {name: linux-aarch64,  os: ubuntu-24.04-arm}
          - {name: macos-x86_64,   os: macos-15-intel}
          - {name: macos-aarch64,  os: macos-latest}
          - {name: windows-x86_64, os: windows-2022, msystem: UCRT64, msysPackages: 'mingw-w64-ucrt-x86_64-gcc make'}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          extensions: bcmath, mbstring, zip, phar, ctype, intl
          ini-values: memory_limit=1G
          coverage: none

      - name: Set up GraalVM (JDK 21 + native-image)
        uses: actions/setup-java@v6.1.0
        with:
          distribution: graalvm
          java-version: '21'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Show the toolchains
        run: |
          php --version
          java -version
          dotnet --version

      - name: Show native-image
        run: native-image --version

      - name: Install a C toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install MSYS2 for the schnorr CLI
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.msysPackages }}
          path-type: inherit

      - name: Build the schnorr CLI
        if: runner.os != 'Windows'
        shell: bash
        run: php packaging/schnorr.php

      - name: Build the schnorr CLI (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: php packaging/schnorr.php

      - name: Run the schnorr BIP-340 vectors
        if: runner.os != 'Windows'
        shell: bash
        run: ./schnorr/tests/bip340_test.sh

      - name: Run the schnorr BIP-340 vectors (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./schnorr/tests/bip340_test.sh

      - name: Set up the MSVC toolchain (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      # The json package's Suite resolves jackson-core from Maven Central on
      # the jvm backend, so the suite needs `mvn` next to the JDK — pinned to
      # the same Maven the nix dev shell carries. It is a single pinned tarball,
      # so it is restored from the cache instead of downloaded once per job; the
      # setup steps below install only when the restore left nothing.
      - name: Cache the Maven install
        uses: actions/cache@v4
        with:
          path: ~/maven
          key: maven-3.9.12-${{ runner.os }}-${{ runner.arch }}

      - name: Set up Maven (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          MAVEN_VERSION=3.9.12
          if [ -x "$HOME/maven/bin/mvn" ]; then
            echo "maven ${MAVEN_VERSION} restored from the cache"
          else
            curl -fsSL -o /tmp/maven.tar.gz "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
            mkdir -p "$HOME/maven"
            tar -xzf /tmp/maven.tar.gz -C "$HOME/maven" --strip-components=1
          fi
          echo "$HOME/maven/bin" >> "$GITHUB_PATH"

      - name: Set up Maven (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mavenVersion = '3.9.12'
          $mavenBin = "$env:USERPROFILE\maven\apache-maven-${mavenVersion}\bin"
          if (Test-Path "$mavenBin\mvn.cmd") {
            Write-Host "maven ${mavenVersion} restored from the cache"
          } else {
            Invoke-WebRequest -Uri "https://archive.apache.org/dist/maven/maven-3/${mavenVersion}/binaries/apache-maven-${mavenVersion}-bin.zip" -OutFile "$env:TEMP\maven.zip"
            Expand-Archive -Path "$env:TEMP\maven.zip" -DestinationPath "$env:USERPROFILE\maven" -Force
          }
          "$mavenBin" >> $env:GITHUB_PATH

      # What the json package's Suite fetches — jackson from Maven Central, its
      # PHP and NuGet packages — lands in the tool caches, and what the compiler
      # fetches lands under `.moggi` in areas it addresses by digest. None of it
      # is derived from this compiler: the areas cached here survive a compiler
      # change by design (`compile/` does not, so it is not restored), which is
      # what makes restoring them a read instead of a re-fetch. The key names the
      # host requirements; a change to them misses and starts the cache over, so a
      # restored tree can only be the pinned versions.
      - name: Cache the host package caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.nuget/packages
            ~/.composer/cache
            ~/.cache/composer
            .moggi/runtime
            .moggi/catalog
            .moggi/packages
          key: moggi-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('libraries/*/*.moggi', 'libraries/*/meta/**', 'tests/registry/**') }}
          restore-keys: |
            moggi-host-${{ runner.os }}-${{ runner.arch }}-

      # `test-all` is the compiler suite plus every bundled library suite:
      # compiler, base, then the json package's Suite once per backend (which
      # is what fetches json's host dependencies above).
      - name: Run the suite
        run: php test-all.php --backend all --native
