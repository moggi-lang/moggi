name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64,   os: ubuntu-24.04}
          - {name: linux-aarch64,  os: ubuntu-24.04-arm}
          - {name: macos-x86_64,   os: macos-15-intel}
          - {name: macos-aarch64,  os: macos-latest}
          - {name: windows-x86_64, os: windows-2022, msystem: UCRT64, msysPackages: 'mingw-w64-ucrt-x86_64-gcc make'}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.5'
          extensions: bcmath, mbstring, zip, phar, ctype
          ini-values: memory_limit=1G
          coverage: none

      - name: Set up GraalVM (JDK 21 + native-image)
        uses: actions/setup-java@v6.0.1
        with:
          distribution: graalvm
          java-version: '21'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Show the toolchains
        run: |
          php --version
          java -version
          dotnet --version

      - name: Show native-image
        run: native-image --version

      - name: Install a C toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install MSYS2 for the schnorr CLI
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2.32.0
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.msysPackages }}
          path-type: inherit

      - name: Build the schnorr CLI
        if: runner.os != 'Windows'
        shell: bash
        run: php scripts/dist/schnorr.php

      - name: Build the schnorr CLI (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: php scripts/dist/schnorr.php

      - name: Run the schnorr BIP-340 vectors
        if: runner.os != 'Windows'
        shell: bash
        run: ./schnorr/tests/bip340_test.sh

      - name: Run the schnorr BIP-340 vectors (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./schnorr/tests/bip340_test.sh

      - name: Point the assembler at the schnorr binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $schnorr = if (Test-Path schnorr/schnorr.exe) { 'schnorr\schnorr.exe' } else { 'schnorr\schnorr' }
          "MOGGI_DIST_SCHNORR=$env:GITHUB_WORKSPACE\$schnorr" >> $env:GITHUB_ENV

      - name: Run the suite
        run: php test.php --backend all --native
