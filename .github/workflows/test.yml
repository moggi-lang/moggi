name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # One job per OS and backend: a job installs only the toolchain its backend
    # needs (GraalVM and Maven for jvm, the .NET SDK and NuGet for dotnet) and
    # runs only that backend's cases. A failure names one backend, and the cheap
    # backends no longer wait behind the slow ones' toolchain setup.
    name: ${{ matrix.platform.name }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [php, jvm, dotnet]
        platform:
          - {name: linux-x86_64,   os: ubuntu-24.04}
          - {name: linux-aarch64,  os: ubuntu-24.04-arm}
          - {name: macos-x86_64,   os: macos-15-intel}
          - {name: macos-aarch64,  os: macos-latest}
          - {name: windows-x86_64, os: windows-2022, msystem: UCRT64, msysPackages: 'mingw-w64-ucrt-x86_64-gcc make'}

    steps:
      - uses: actions/checkout@v7.0.1

      # The concurrency runtime needs ZTS PHP and ext-parallel. ext-parallel is
      # installed with PIE below, not through setup-php's deprecated PECL path.
      - name: Set up PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.6'
          extensions: bcmath, mbstring, zip, phar, ctype, intl
          tools: pie
          ini-values: memory_limit=1G
          coverage: none
        env:
          phpts: zts
          fail-fast: true

      # macOS PHP comes from Homebrew and is writable by the runner user, so
      # PIE can install build tools with brew when they are missing. Linux PHP is
      # system-owned, so PIE runs as root and may use apt for the same tools.
      - name: Install ext-parallel with PIE (Linux)
        if: runner.os == 'Linux'
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: sudo env "PATH=$PATH" COMPOSER_ALLOW_SUPERUSER=1 "$(command -v pie)" install pecl/parallel:1.2.15 --no-interaction --auto-install-build-tools

      - name: Install ext-parallel with PIE (macOS)
        if: runner.os == 'macOS'
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: pie install pecl/parallel:1.2.15 --no-interaction --auto-install-build-tools

      - name: Install ext-parallel with PIE (Windows)
        if: runner.os == 'Windows'
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: pie install pecl/parallel:1.2.15 --no-interaction

      - name: Verify ZTS and ext-parallel
        run: |
          php -r 'printf("PHP ZTS: %s, parallel: %s\n", PHP_ZTS ? "yes" : "no", extension_loaded("parallel") ? "yes" : "no");'
          php -r 'exit(PHP_ZTS && extension_loaded("parallel") ? 0 : 1);'

      # GraalVM and native-image (jvm only).
      - name: Cache GraalVM
        if: matrix.backend == 'jvm'
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/Java_GraalVM_jdk
          key: graalvm-21-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Set up GraalVM
        if: matrix.backend == 'jvm'
        uses: actions/setup-java@v6.3.0
        with:
          distribution: graalvm
          java-version: '21'

      # The compiler, cache and repl cases compile jvm code on every leg, and the
      # jvm backend emits class-file version 65, so the JDK that verifies a
      # `foreign jvm` member is the 21 one on every leg too. Windows would
      # otherwise answer with the image's Java 8, which has no `String.lines`
      # and a `jar` without long options.
      - name: Set up a JDK for the other backends' jvm legs
        if: matrix.backend != 'jvm'
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      # Maven installation and dependency repository (jvm only).
      - name: Cache Maven installation
        if: matrix.backend == 'jvm'
        uses: actions/cache@v6
        with:
          path: ~/maven
          key: maven-3.9.12-${{ runner.os }}-${{ runner.arch }}

      - name: Set up Maven (Linux, macOS)
        if: matrix.backend == 'jvm' && runner.os != 'Windows'
        shell: bash
        run: |
          MAVEN_VERSION=3.9.12
          if [ -x "$HOME/maven/bin/mvn" ]; then
            echo "Maven restored from cache"
          else
            curl -fsSL -o /tmp/maven.tar.gz \
              "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
            mkdir -p "$HOME/maven"
            tar -xzf /tmp/maven.tar.gz -C "$HOME/maven" --strip-components=1
          fi
          echo "$HOME/maven/bin" >> "$GITHUB_PATH"

      - name: Set up Maven (Windows)
        if: matrix.backend == 'jvm' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $mavenVersion = '3.9.12'
          $mavenBin = "$env:USERPROFILE\maven\apache-maven-${mavenVersion}\bin"
          if (Test-Path "$mavenBin\mvn.cmd") {
            Write-Host "Maven restored from cache"
          } else {
            Invoke-WebRequest `
              -Uri "https://archive.apache.org/dist/maven/maven-3/${mavenVersion}/binaries/apache-maven-${mavenVersion}-bin.zip" `
              -OutFile "$env:TEMP\maven.zip"
            Expand-Archive -Path "$env:TEMP\maven.zip" -DestinationPath "$env:USERPROFILE\maven" -Force
          }
          "$mavenBin" >> $env:GITHUB_PATH

      - name: Cache Maven dependencies
        if: matrix.backend == 'jvm'
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-deps-${{ runner.os }}-${{ runner.arch }}-v1

      # .NET SDK and NuGet (dotnet only).
      - name: Cache .NET SDK
        if: matrix.backend == 'dotnet'
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/dotnet
          key: dotnet-8-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Set up .NET SDK
        if: matrix.backend == 'dotnet'
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        if: matrix.backend == 'dotnet'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('libraries/**/*.csproj', 'libraries/**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Show the PHP toolchain
        run: php --version

      - name: Show the JVM toolchain
        if: matrix.backend == 'jvm'
        run: |
          java -version
          native-image --version
          mvn --version

      - name: Show the .NET toolchain
        if: matrix.backend == 'dotnet'
        run: dotnet --version

      # Linux C toolchain.
      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-${{ runner.os }}-${{ runner.arch }}-clang-v1

      - name: Install a C toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld patchelf musl-tools
          musl_arch="$(uname -m)"
          sudo ln -sf /usr/bin/musl-gcc "/usr/local/bin/${musl_arch}-linux-musl-gcc"
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 5 --retry-delay 5 \
              https://github.com/madler/zlib/archive/refs/tags/v1.3.1.tar.gz \
              -o /tmp/zlib.tar.gz && \
            file /tmp/zlib.tar.gz | grep -q 'gzip compressed' && break
            echo "zlib download attempt $attempt failed; retrying..." >&2
            rm -f /tmp/zlib.tar.gz
            sleep 10
          done
          test -s /tmp/zlib.tar.gz
          file /tmp/zlib.tar.gz
          rm -rf /tmp/zlib && mkdir -p /tmp/zlib
          tar -xzf /tmp/zlib.tar.gz -C /tmp/zlib --strip-components=1
          ( cd /tmp/zlib && CC=musl-gcc ./configure --static && make -j"$(nproc)" )
          sudo mkdir -p "/usr/lib/${musl_arch}-linux-musl"
          sudo cp /tmp/zlib/libz.a "/usr/lib/${musl_arch}-linux-musl/libz.a"

      # Windows C toolchain.
      - name: Install MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2.34.0
        with:
          msystem: ${{ matrix.platform.msystem }}
          update: false
          install: ${{ matrix.platform.msysPackages }}
          path-type: inherit
          cache: true

      - name: Set up the MSVC toolchain (Windows)
        # Native AOT and native-image both link with MSVC on Windows.
        if: runner.os == 'Windows' && matrix.backend != 'php'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      # Schnorr CLI.
      - name: Cache Schnorr CLI
        id: schnorr-cache
        uses: actions/cache@v6
        with:
          path: schnorr
          key: schnorr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/schnorr.php', 'schnorr/**') }}

      - name: Build the schnorr CLI
        if: runner.os != 'Windows' && steps.schnorr-cache.outputs.cache-hit != 'true'
        shell: bash
        run: php packaging/schnorr.php

      - name: Build the schnorr CLI (Windows)
        if: runner.os == 'Windows' && steps.schnorr-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: php packaging/schnorr.php

      - name: Run the schnorr BIP-340 vectors
        if: runner.os != 'Windows'
        shell: bash
        run: ./schnorr/tests/bip340_test.sh

      - name: Run the schnorr BIP-340 vectors (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./schnorr/tests/bip340_test.sh

      # Moggi's persistent compiler-managed artifacts.
      - name: Cache Moggi artifacts
        uses: actions/cache@v6
        with:
          path: |
            .moggi/runtime
            .moggi/catalog
            .moggi/packages
          key: moggi-${{ matrix.backend }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('libraries/*/*.moggi', 'libraries/*/meta/**', 'tests/registry/**') }}
          restore-keys: |
            moggi-${{ matrix.backend }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Run the suite
        run: php test-all.php --backend ${{ matrix.backend }} --native

      # The packaged executable is the portable artifact. PHP needs the micro
      # runtime, so its package check runs in the static matrix instead; the
      # other backends run here from a different working directory, which
      # catches a broken rpath/install name or a Windows DLL search path.
      - name: Verify the native package bundle
        if: matrix.backend != 'php'
        env:
          MOGGI_NATIVE_BACKEND: ${{ matrix.backend }}
        run: php tests/cli/native_package.php

  # Every feasible static build is exercised here, and the platforms that
  # cannot produce one run the same probe as a refusal. Keeping this matrix
  # separate from the general suite makes the backend/platform coverage — and
  # especially the JVM leg — visible without hiding it in a test job.
  static:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: 'linux-x86_64 / php static',    runner: ubuntu-24.04,     target: linux-x86_64,  kind: php}
          - {name: 'linux-aarch64 / php static',   runner: ubuntu-24.04-arm, target: linux-aarch64, kind: php}
          # GraalVM's fully static native-image target is x86_64-only; the
          # aarch64 JVM leg still builds and runs the non-static package above.
          - {name: 'linux-x86_64 / jvm static',    runner: ubuntu-24.04,     target: linux-x86_64,  kind: jvm}
          - {name: 'linux-x86_64 / dotnet static', runner: ubuntu-24.04,     target: linux-x86_64,  kind: dotnet}
          - {name: 'linux-aarch64 / dotnet static', runner: ubuntu-24.04-arm, target: linux-aarch64, kind: dotnet}
          - {name: 'macos-x86_64 / static refusal',  runner: macos-15-intel, target: macos-x86_64,  kind: refusal}
          - {name: 'macos-aarch64 / static refusal', runner: macos-latest,   target: macos-aarch64, kind: refusal}
          - {name: 'windows-x86_64 / static refusal', runner: windows-2022,  target: windows-x86_64, kind: refusal}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up PHP
        if: matrix.kind != 'dotnet'
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.6'
          extensions: bcmath, mbstring, zip, phar, ctype, intl
          ini-values: memory_limit=1G
          coverage: none

      - name: Install the micro runtime build dependencies
        if: matrix.kind == 'php'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates curl unzip zstd \
            clang binutils autoconf make pkg-config libzip-dev libonig-dev \
            libicu-dev re2c flex bison automake autopoint libtool zlib1g-dev patchelf

      - name: Cache the micro runtime build
        if: matrix.kind == 'php'
        uses: actions/cache@v6
        with:
          path: |
            .dist-cache/downloads
            .dist-cache/build
            .dist-cache/runtimes
          key: static-php-${{ matrix.target }}-${{ hashFiles('dist/runtimes.json', 'dist/runtimes.lock.json') }}

      - name: Build the micro PHP runtime
        if: matrix.kind == 'php'
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            require "packaging/assemble.php";
            $config = \Moggi\Dist\loadRuntimeConfig();
            $target = \Moggi\Dist\hostTarget($config);
            $dir = \Moggi\Dist\prepareRuntime("php-native", $target, $config);
            if (! is_file($dir . "/micro.sfx")) {
                fwrite(STDERR, "micro.sfx is missing at {$dir}\n");
                exit(1);
            }
            file_put_contents(getenv("GITHUB_ENV"), "MOGGI_MICRO_SFX={$dir}\n", FILE_APPEND);
          '

      - name: Verify the native PHP package bundle
        if: matrix.kind == 'php'
        env:
          MOGGI_NATIVE_BACKEND: php
        run: php tests/cli/native_package.php

      - name: Cache GraalVM
        if: matrix.kind == 'jvm'
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/Java_GraalVM_jdk
          key: graalvm-21-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Set up GraalVM
        if: matrix.kind == 'jvm'
        uses: actions/setup-java@v6.3.0
        with:
          distribution: graalvm
          java-version: '21'

      - name: Install the musl C toolchain
        if: matrix.kind == 'jvm'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang binutils lld musl-tools
          musl_arch="$(uname -m)"
          sudo ln -sf /usr/bin/musl-gcc "/usr/local/bin/${musl_arch}-linux-musl-gcc"
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 5 --retry-delay 5 \
              https://github.com/madler/zlib/archive/refs/tags/v1.3.1.tar.gz \
              -o /tmp/zlib.tar.gz && \
            file /tmp/zlib.tar.gz | grep -q 'gzip compressed' && break
            echo "zlib download attempt $attempt failed; retrying..." >&2
            rm -f /tmp/zlib.tar.gz
            sleep 10
          done
          test -s /tmp/zlib.tar.gz
          file /tmp/zlib.tar.gz
          rm -rf /tmp/zlib && mkdir -p /tmp/zlib
          tar -xzf /tmp/zlib.tar.gz -C /tmp/zlib --strip-components=1
          ( cd /tmp/zlib && CC=musl-gcc ./configure --static && make -j"$(nproc)" )
          sudo mkdir -p "/usr/lib/${musl_arch}-linux-musl"
          sudo cp /tmp/zlib/libz.a "/usr/lib/${musl_arch}-linux-musl/libz.a"

      - name: Build, relink, verify and run the static PHP or JVM executable
        if: matrix.kind == 'php' || matrix.kind == 'jvm'
        env:
          MOGGI_NATIVE_BACKEND: ${{ matrix.kind }}
          MOGGI_STATIC_REQUIRED: '1'
        run: php tests/cli/native_static_package.php

      - name: Build, relink, verify and run the static .NET package
        if: matrix.kind == 'dotnet'
        run: |
          docker run --rm \
            -e MOGGI_NATIVE_BACKEND=dotnet \
            -e MOGGI_STATIC_REQUIRED=1 \
            -v "$PWD:/work" \
            -w /work \
            mcr.microsoft.com/dotnet/sdk:8.0-alpine \
            sh -c '
              set -e
              apk add --no-cache \
                --repository=https://dl-cdn.alpinelinux.org/alpine/edge/community \
                --repository=https://dl-cdn.alpinelinux.org/alpine/edge/testing \
                php86 php86-phar php86-mbstring php86-zip php86-ctype \
                php86-openssl php86-tokenizer php86-intl \
                binutils build-base clang lld zlib-dev zlib-static musl-dev
              php86 tests/cli/native_static_package.php
            '

      - name: Assert static linking is refused on non-Linux platforms
        if: matrix.kind == 'refusal'
        shell: bash
        run: |
          for backend in php jvm dotnet; do
            MOGGI_NATIVE_BACKEND="$backend" MOGGI_STATIC_REQUIRED=1 \
              php tests/cli/native_static_package.php
          done
