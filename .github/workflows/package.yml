name: package

on:
  workflow_dispatch:
  push:
    tags: ['*']
    branches: [build]

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x86_64,  runner: ubuntu-24.04}
          - {target: linux-aarch64, runner: ubuntu-24.04-arm}

    steps:
      - name: Install the build root's own prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl unzip zstd sudo

      - uses: actions/checkout@v7.0.1

      - name: Set up PHP for the build scripts
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.6'
          extensions: bcmath, mbstring, zip, phar, ctype, intl
          tools: pie
          ini-values: memory_limit=1G
          coverage: none

      - name: Install the build dependencies
        # The tools on the second line are what static-php-cli's `spc` checks for
        # before it compiles the micro PHP runtime; declaring them here keeps the
        # build from installing anything of its own midway through.
        run: |
          apt-get install -y --no-install-recommends \
            clang binutils autoconf make pkg-config libzip-dev libonig-dev libicu-dev \
            libsodium-dev re2c flex bison automake autopoint libtool zlib1g-dev

      - name: Cache downloads and builds
        uses: actions/cache@v6
        with:
          path: |
            .dist-cache/downloads
            .dist-cache/build
          key: dist-${{ matrix.target }}-${{ hashFiles('dist/runtimes.lock.json') }}

      - name: Validate the pinned runtimes
        run: php packaging/pin.php --check --target ${{ matrix.target }}

      - name: Build the distributions
        # `--native-smoke` builds one native executable with each bundled
        # toolchain a variant ships, so the published archives are shown to
        # produce natives, not only managed artifacts.
        run: php packaging/assemble.php --target ${{ matrix.target }} --glibc-floor --native-smoke --archives --out dist-out

      - name: Upload the archives
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-out/${{ matrix.target }}/*.tar.gz
            dist-out/${{ matrix.target }}/*.zip

  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: macos-x86_64,   runner: macos-15-intel}
          - {target: macos-aarch64,  runner: macos-latest}
          - {target: windows-x86_64, runner: windows-2022, msystem: UCRT64, msysPackages: 'mingw-w64-ucrt-x86_64-gcc make'}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up PHP for the build scripts
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.6'
          extensions: bcmath, mbstring, zip, phar, ctype, intl
          tools: pie
          ini-values: memory_limit=1G
          coverage: none

      - name: Install Clang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
          }
          clang --version

      - name: Install the PHP build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libzip oniguruma icu4c libsodium re2c bison automake autoconf libtool cmake
          {
            echo "PKG_CONFIG_PATH=$(brew --prefix libzip)/lib/pkgconfig:$(brew --prefix oniguruma)/lib/pkgconfig:$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix libsodium)/lib/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Install MSYS2 for the schnorr CLI
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2.34.0
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.msysPackages }}
          path-type: inherit

      - name: Build the schnorr CLI (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: php packaging/schnorr.php

      - name: Put the Git tools on PATH (Windows)
        # `spc` wants the MinGW `patch.exe` that ships with Git for Windows
        # before it builds the micro PHP runtime.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mingw = 'C:\Program Files\Git\usr\bin'
          if (-not (Test-Path "$mingw\patch.exe")) { throw "patch.exe is not in $mingw" }
          if (-not (Get-Command patch.exe -ErrorAction SilentlyContinue)) {
            $mingw | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Cache downloads and builds
        uses: actions/cache@v6
        with:
          path: |
            .dist-cache/downloads
            .dist-cache/build
          key: dist-${{ matrix.target }}-${{ hashFiles('dist/runtimes.lock.json') }}

      - name: Validate the pinned runtimes
        run: php packaging/pin.php --check --target ${{ matrix.target }}

      - name: Build the distributions
        run: php packaging/assemble.php --target ${{ matrix.target }} --archives --out dist-out

      # The one Windows path the suite cannot take: `runtime php build`'s case
      # stands a `php.exe` in with a shell script, which only a POSIX host can
      # run, so it reports a skip there. This unpacks the archive that was just
      # built and runs the real thing, under a path with a space, parentheses and
      # an `&`, then starts the copy from another directory with PHPRC unset.
      - name: The built Windows runtime must produce a portable copy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $archive = @(Get-ChildItem 'dist-out/${{ matrix.target }}/moggi-php-*-${{ matrix.target }}.zip' -ErrorAction SilentlyContinue)
          if ($archive.Count -ne 1) {
            throw "expected one moggi-php archive for ${{ matrix.target }}, found $($archive.Count)"
          }

          $smoke = Join-Path $env:RUNNER_TEMP 'portable smoke (x) & php'
          if (Test-Path $smoke) { Remove-Item -Recurse -Force $smoke }
          New-Item -ItemType Directory -Path $smoke | Out-Null
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $smoke

          $install = Join-Path $smoke 'moggi-php'
          $compiler = Join-Path $install 'bin\moggi.exe'
          if (-not (Test-Path $compiler)) { throw "the archive carries no compiler at $compiler" }

          $env:MOGGI_CACHE_DIR = Join-Path $smoke 'cache'
          New-Item -ItemType Directory -Force -Path $env:MOGGI_CACHE_DIR | Out-Null
          $copy = Join-Path $smoke 'copy (x) & php'
          & $compiler runtime php build --out $copy
          if ($LASTEXITCODE -ne 0) { throw "runtime php build exited $LASTEXITCODE" }

          $launcher = Join-Path $copy 'bin\php.cmd'
          if (-not (Test-Path $launcher)) { throw "the copy has no launcher at $launcher" }
          if (-not (Test-Path (Join-Path $copy 'php.ini'))) { throw "the copy has no php.ini at $copy" }

          function Get-Modules($listing) {
            @($listing | ForEach-Object { "$_".Trim() } | Where-Object { $_ -ne '' -and -not $_.StartsWith('[') })
          }

          # Compare the copy with the runtime it came from, so this is not a
          # hard-coded module list. PHPRC is how the packaged ini finds its ext/.
          $env:PHPRC = Join-Path $install 'runtime\php'
          $env:PHP_INI_SCAN_DIR = ''
          Push-Location $env:SystemDrive
          try {
            $sourceListing = & (Join-Path $install 'runtime\php\php.exe') -m 2>&1
            $sourceCode = $LASTEXITCODE

            # The case the copy's launcher exists for: another directory, with
            # nothing inherited that could point PHP at this machine's own ini.
            Remove-Item Env:\PHPRC -ErrorAction SilentlyContinue
            Remove-Item Env:\PHP_INI_SCAN_DIR -ErrorAction SilentlyContinue
            $copyListing = & $launcher -m 2>&1
            $copyCode = $LASTEXITCODE
          } finally {
            Pop-Location
          }

          if ($sourceCode -ne 0) { throw "the packaged runtime exited $sourceCode from another directory`n$sourceListing" }
          if ($copyCode -ne 0) { throw "php.cmd -m exited $copyCode`n$copyListing" }

          $expected = Get-Modules $sourceListing
          $loaded = Get-Modules $copyListing
          if ($loaded.Count -eq 0) { throw "php.cmd -m listed no module at all`n$copyListing" }

          $missing = @($expected | Where-Object { $loaded -notcontains $_ })
          if ($missing.Count -gt 0) {
            throw "the copy does not load $($missing -join ', '), which the runtime it came from does`n$copyListing"
          }

          "php.cmd -m loaded $($loaded.Count) modules from another directory, including all $($expected.Count) the runtime loads"

      - name: Upload the archives
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-out/${{ matrix.target }}/*.tar.gz
            dist-out/${{ matrix.target }}/*.zip

  publish:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/build'
    needs: [linux, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      channel: ${{ steps.name.outputs.channel }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Name the build
        id: name
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            channel=release
          else
            tag=dev-build
            channel=dev
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "publishing ${tag} (${channel})"

      - name: The tag and VERSION must agree
        if: github.ref_type == 'tag'
        run: |
          version="$(cat VERSION)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "VERSION says ${version}, the tag says ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "releasing ${version}"

      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist-out
          merge-multiple: true

      - name: Write SHA256SUMS
        run: |
          cd dist-out
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Attest the provenance of the archives
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist-out/*.tar.gz
            dist-out/*.zip

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.name.outputs.channel }}" = "release" ]; then
            gh release create "${{ steps.name.outputs.tag }}" \
              --draft \
              --title "${{ steps.name.outputs.tag }}" \
              --generate-notes
          else
            gh release delete "${{ steps.name.outputs.tag }}" --yes --cleanup-tag || true
            gh release create "${{ steps.name.outputs.tag }}" \
              --prerelease \
              --target "${{ github.sha }}" \
              --title "${{ steps.name.outputs.tag }}" \
              --notes "Dev build of ${{ github.sha }}, from the \`build\` branch. Not a release: this tag is moved onto the newest dev build, and verify SHA256SUMS before using it."
          fi

      - name: Upload the archives and the checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.name.outputs.tag }}" \
            dist-out/*.tar.gz dist-out/*.zip dist-out/SHA256SUMS

      - name: Remove the older dev tags
        if: steps.name.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[].tag_name] | map(select(. != "dev-build" and (. == "dev" or startswith("dev-")))) | .[]' \
            | while read -r stale; do
                gh release delete "${stale}" --yes --cleanup-tag
              done

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.name.outputs.tag }}" --draft=false

  website:
    # Rewrite the release-dependent links on moggi-lang.org, so a release is a
    # command and not a hand edit of 25 links. The site is a separate repository,
    # so this stays inert until WEBSITE_REPOSITORY (a variable) and WEBSITE_TOKEN
    # (a secret with push access to it) are configured.
    if: github.ref_type == 'tag' && vars.WEBSITE_REPOSITORY != ''
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up PHP for the build scripts
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.6'
          coverage: none

      - name: Check out the website
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ vars.WEBSITE_REPOSITORY }}
          token: ${{ secrets.WEBSITE_TOKEN }}
          path: website

      - name: Rewrite the release links
        run: php packaging/website.php --tag "$RELEASE_TAG" --file website/index.html

      - name: Commit and push
        working-directory: website
        run: |
          if git diff --quiet; then
            echo "website already names ${RELEASE_TAG}"
            exit 0
          fi
          git config user.name "moggi-bot"
          git config user.email "noreply@moggi-lang.org"
          git add index.html
          git commit -m "release ${RELEASE_TAG}"
          git push

  verify:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - name: Download the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$RELEASE_TAG" --dir release --repo "$GITHUB_REPOSITORY"

      - name: Every published archive must match its checksum
        run: cd release && sha256sum -c SHA256SUMS

      - name: Set up the PHP that the minimal distribution runs on
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.6'
          extensions: bcmath, mbstring, zip, phar, ctype, intl
          ini-values: memory_limit=1G
          coverage: none

      - name: A published installation must run
        run: |
          cd release
          mkdir -p run && tar -xzf moggi-minimal-*-linux-x86_64.tar.gz -C run
          cd /tmp
          "$GITHUB_WORKSPACE/release/run/moggi-minimal/bin/moggi" version
          "$GITHUB_WORKSPACE/release/run/moggi-minimal/bin/moggi" run \
            "$GITHUB_WORKSPACE/release/run/moggi-minimal/examples/factorial"

      - name: The bundled runtimes must work from the archive
        run: |
          cd release
          tar -xzf moggi-php-*-linux-x86_64.tar.gz -C run
          cd /tmp
          "$GITHUB_WORKSPACE/release/run/moggi-php/bin/moggi" version --json
          "$GITHUB_WORKSPACE/release/run/moggi-php/bin/moggi" run \
            "$GITHUB_WORKSPACE/release/run/moggi-php/examples/factorial"

      - name: The bundled PHP must satisfy the compiler runtime contract after unpacking
        run: |
          php_home="$GITHUB_WORKSPACE/release/run/moggi-php/runtime/php"
          # PHPRC is how the packaged ini finds its own extension directory, so
          # exercise it instead of overriding extension_dir from the command line.
          PHPRC="$php_home" PHP_INI_SCAN_DIR= \
            LD_LIBRARY_PATH="$php_home/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
              "$php_home/bin/php" \
              -r 'exit(PHP_ZTS && extension_loaded("parallel") && extension_loaded("ctype") && extension_loaded("tokenizer") ? 0 : 1);'

  verify-native:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: macos-aarch64,  runner: macos-latest, archive: 'moggi-php-*-macos-aarch64.tar.gz'}
          - {target: windows-x86_64, runner: windows-2022, archive: 'moggi-php-*-windows-x86_64.zip'}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Download the published archive for this platform
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" \
            --dir release --pattern "${{ matrix.archive }}" --repo "$GITHUB_REPOSITORY"
          ls -la release

      - name: The published archive must run here
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            unzip -o release/*.zip -d release/run
            exe=".exe"
          else
            mkdir -p release/run && tar -xzf release/*.tar.gz -C release/run
            exe=""
          fi
          ls release/run
          ( cd /tmp && "$GITHUB_WORKSPACE/release/run/moggi-php/bin/moggi${exe}" version )

      - name: The bundled PHP must satisfy the compiler runtime contract after unpacking
        shell: bash
        run: |
          php_home="$GITHUB_WORKSPACE/release/run/moggi-php/runtime/php"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            # The ini is relocatable only if PHPRC resolves; do not hide that by
            # overriding extension_dir on the command line. Windows PHP needs a
            # Windows-form path for PHPRC.
            PHPRC="$(cygpath -w "$php_home")" PHP_INI_SCAN_DIR= \
              "$php_home/php.exe" \
              -r 'exit(PHP_ZTS && extension_loaded("parallel") && extension_loaded("ctype") && extension_loaded("tokenizer") ? 0 : 1);'
          else
            PHPRC="$php_home" PHP_INI_SCAN_DIR= \
              DYLD_FALLBACK_LIBRARY_PATH="$php_home/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}" \
                "$php_home/bin/php" \
                -r 'exit(PHP_ZTS && extension_loaded("parallel") && extension_loaded("ctype") && extension_loaded("tokenizer") ? 0 : 1);'
          fi
