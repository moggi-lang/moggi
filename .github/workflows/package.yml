name: package

on:
  workflow_dispatch:
  push:
    tags: ['*']
    branches: [build]

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x86_64,  runner: ubuntu-24.04}
          - {target: linux-aarch64, runner: ubuntu-24.04-arm}

    steps:
      - name: Install the build root's own prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl unzip zstd sudo

      - uses: actions/checkout@v7.0.1

      - name: Set up PHP for the build scripts
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.5'
          extensions: bcmath, mbstring, zip, phar, ctype, intl
          ini-values: memory_limit=1G
          coverage: none

      - name: Install the build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            clang binutils autoconf make pkg-config libzip-dev libonig-dev libicu-dev

      - name: Cache downloads and builds
        uses: actions/cache@v4.3.0
        with:
          path: |
            .dist-cache/downloads
            .dist-cache/build
          key: dist-${{ matrix.target }}-${{ hashFiles('dist/runtimes.lock.json') }}

      - name: Validate the pinned runtimes
        run: php scripts/dist/pin.php --check --target ${{ matrix.target }}

      - name: Build the distributions
        run: php scripts/dist/assemble.php --target ${{ matrix.target }} --glibc-floor --archives --out "${{ github.workspace }}/dist-out"

      - name: Upload the archives
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-out/${{ matrix.target }}/*.tar.gz
            dist-out/${{ matrix.target }}/*.zip

  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: macos-x86_64,   runner: macos-15-intel}
          - {target: macos-aarch64,  runner: macos-latest}
          - {target: windows-x86_64, runner: windows-2022, msystem: UCRT64, msysPackages: 'mingw-w64-ucrt-x86_64-gcc make'}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up PHP for the build scripts
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.5'
          extensions: bcmath, mbstring, zip, phar, ctype, intl
          ini-values: memory_limit=1G
          coverage: none

      - name: Install Clang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
          }
          clang --version

      - name: Install the PHP build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libzip oniguruma icu4c
          {
            echo "PKG_CONFIG_PATH=$(brew --prefix libzip)/lib/pkgconfig:$(brew --prefix oniguruma)/lib/pkgconfig:$(brew --prefix icu4c)/lib/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Install MSYS2 for the schnorr CLI
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2.32.0
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.msysPackages }}
          path-type: inherit

      - name: Build the schnorr CLI (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: php scripts/dist/schnorr.php

      - name: Point the assembler at the schnorr binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $schnorr = if (Test-Path schnorr/schnorr.exe) { 'schnorr\schnorr.exe' } else { 'schnorr\schnorr' }
          "MOGGI_DIST_SCHNORR=$env:GITHUB_WORKSPACE\$schnorr" >> $env:GITHUB_ENV

      - name: Cache downloads and builds
        uses: actions/cache@v4.3.0
        with:
          path: |
            .dist-cache/downloads
            .dist-cache/build
          key: dist-${{ matrix.target }}-${{ hashFiles('dist/runtimes.lock.json') }}

      - name: Validate the pinned runtimes
        run: php scripts/dist/pin.php --check --target ${{ matrix.target }}

      - name: Build the distributions
        run: php scripts/dist/assemble.php --target ${{ matrix.target }} --archives --out "${{ github.workspace }}/dist-out"

      - name: Upload the archives
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-out/${{ matrix.target }}/*.tar.gz
            dist-out/${{ matrix.target }}/*.zip

  publish:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/build'
    needs: [linux, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      channel: ${{ steps.name.outputs.channel }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Name the build
        id: name
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            channel=release
          else
            tag="dev-$(date -u +%Y%m%d)-$(git rev-parse --short=7 HEAD)"
            channel=dev
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "publishing ${tag} (${channel})"

      - name: The tag and VERSION must agree
        if: github.ref_type == 'tag'
        run: |
          version="$(cat VERSION)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "VERSION says ${version}, the tag says ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "releasing ${version}"

      - uses: actions/download-artifact@v4.3.0
        with:
          path: dist-out
          merge-multiple: true

      - name: Write SHA256SUMS
        run: |
          cd dist-out
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Attest the provenance of the archives
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-path: |
            dist-out/*.tar.gz
            dist-out/*.zip

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.name.outputs.channel }}" = "release" ]; then
            gh release create "${{ steps.name.outputs.tag }}" \
              --draft \
              --title "${{ steps.name.outputs.tag }}" \
              --generate-notes
          else
            gh release create "${{ steps.name.outputs.tag }}" \
              --prerelease \
              --target "${{ github.sha }}" \
              --title "${{ steps.name.outputs.tag }}" \
              --notes "Dev build of ${{ github.sha }}, from the \`build\` branch. Not a release: expect it to be pruned, and verify SHA256SUMS before using it."
          fi

      - name: Upload the archives and the checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.name.outputs.tag }}" \
            dist-out/*.tar.gz dist-out/*.zip dist-out/SHA256SUMS

      - name: Move the dev alias
        if: steps.name.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "dev" \
            --notes "Latest dev build: ${{ steps.name.outputs.tag }}."

      - name: Keep the last five dev builds
        if: steps.name.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("dev-"))] | sort_by(.created_at) | reverse | .[5:] | .[].tag_name' \
            | while read -r stale; do
                gh release delete "${stale}" --yes --cleanup-tag
              done

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.name.outputs.tag }}" --draft=false

  verify:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - name: Download the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$RELEASE_TAG" --dir release --repo "$GITHUB_REPOSITORY"

      - name: Every published archive must match its checksum
        run: cd release && sha256sum -c SHA256SUMS

      - name: A published installation must run
        run: |
          cd release
          mkdir -p run && tar -xzf moggi-minimal-*-linux-x86_64.tar.gz -C run
          cd /tmp
          "$GITHUB_WORKSPACE/release/run/moggi-minimal/bin/moggi" version
          "$GITHUB_WORKSPACE/release/run/moggi-minimal/bin/moggi" run \
            "$GITHUB_WORKSPACE/release/run/moggi-minimal/examples/factorial"

      - name: The bundled runtimes must work from the archive
        run: |
          cd release
          tar -xzf moggi-php-*-linux-x86_64.tar.gz -C run
          cd /tmp
          "$GITHUB_WORKSPACE/release/run/moggi-php/bin/moggi" version --json
          "$GITHUB_WORKSPACE/release/run/moggi-php/bin/moggi" run \
            "$GITHUB_WORKSPACE/release/run/moggi-php/examples/factorial"

  verify-native:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: macos-aarch64,  runner: macos-latest, archive: 'moggi-php-*-macos-aarch64.tar.gz'}
          - {target: windows-x86_64, runner: windows-2022, archive: 'moggi-php-*-windows-x86_64.zip'}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Download the published archive for this platform
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" \
            --dir release --pattern "${{ matrix.archive }}" --repo "$GITHUB_REPOSITORY"
          ls -la release

      - name: The published archive must run here
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            unzip -o release/*.zip -d release/run
            exe=".exe"
          else
            mkdir -p release/run && tar -xzf release/*.tar.gz -C release/run
            exe=""
          fi
          ls release/run
          ( cd /tmp && "$GITHUB_WORKSPACE/release/run/moggi-php/bin/moggi${exe}" version )
